<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = '/PRD'
        var path = location.pathname
        if (path.indexOf(base) === 0) path = path.slice(base.length)
        path = path.replace(/^\/+/, '')

        // Nested static apps: send browser to that app root and let it restore the path.
        // GitHub Pages only serves the repo-root 404.html, so SPA deep links need this handshake.
        var nested = [
          { prefix: 'matching-management/', home: base + '/matching-management/' },
          { prefix: 'fate-atlas/', home: base + '/fate-atlas/' },
          { prefix: 'crmp-admin/', home: base + '/crmp-admin/' },
          { prefix: 'venture-scan/', home: base + '/venture-scan/' },
          { prefix: 'brand-atlas/', home: base + '/brand-atlas/' },
          { prefix: 'ludus-atlas/', home: base + '/ludus-atlas/' },
          { prefix: 'mille/', home: base + '/mille/' },
          { prefix: 'seen/', home: base + '/seen/' },
          { prefix: 'risk-discovery/', home: base + '/risk-discovery/' },
        ]
        for (var i = 0; i < nested.length; i++) {
          if (path.indexOf(nested[i].prefix) === 0) {
            try {
              sessionStorage.setItem('prd-pages-redirect', location.href)
            } catch (e) {}
            location.replace(nested[i].home + location.search + location.hash)
            return
          }
        }

        // Legacy MatchingManagement deep links that used to live at /PRD/<page>
        var mm = {
          overview: 1,
          'contract-list': 1,
          'coin-introduce': 1,
          'funding-fee-list': 1,
          'kline-manage': 1,
          'trade-amount-factor': 1,
          'admin-adl': 1,
          'market-source': 1,
          'index-price': 1,
          'fair-price': 1,
          'index-market-link': 1,
          'funding-rate': 1,
          'position-list': 1,
          'position-value-stats': 1,
          'active-order': 1,
          'trigger-order': 1,
          'stop-order': 1,
          'active-order-history-deal': 1,
          'trigger-order-history-deal': 1,
          'liquidate-history': 1,
          'adl-history': 1,
          'stop-order-history-deal': 1,
          'user-asset': 1,
          'user-rate-config': 1,
          'user-info': 1,
          'user-risk-settings': 1,
          'user-blacklist': 1,
          'blacklist-group': 1,
          'margin-change': 1,
          'redis-key-manage': 1,
          'redis-value-manage': 1,
          'openapi-whitelist': 1,
          'openapi-market': 1,
          'openapi-mm-blacklist': 1,
          'financial-report': 1,
          'transfer-record': 1,
          'financial-account': 1,
          'financial-recon': 1,
          'finance-flow': 1,
          'api-open-list': 1,
          'api-ratio-config': 1,
          'api-user-limit-config': 1,
          'api-user-taker-blacklist': 1,
          'api-user-taker-config': 1,
          'tools-close-position': 1,
          'tools-global-frequency': 1,
          'tools-open-bottom-position': 1,
          'risk-funding-fee-change': 1,
          'risk-liquidation-switch': 1,
          'risk-market-price-limit': 1,
          'risk-reserve-list': 1,
          'risk-reserve-detail': 1,
          'risk-trading-restriction': 1,
          'risk-spread-alert': 1,
          'risk-no-trade-monitor': 1,
          'risk-depth-monitor': 1,
          'large-liquidation-warning': 1,
          'large-liquidation-notify': 1,
          'adl-failure': 1,
          'db-account-alert': 1,
          'db-takeover-account': 1,
          'db-takeover-fund-record': 1,
          'parameter-recommendations': 1,
          'mm-db-takeover-account': 1,
          'mm-db-fund-flow': 1,
          'mm-db-account-alarm': 1,
        }
        var first = path.split('/')[0]
        if (mm[first]) {
          var target = base + '/matching-management/' + path + location.search + location.hash
          try {
            sessionStorage.setItem('prd-pages-redirect', target)
          } catch (e) {}
          location.replace(base + '/matching-management/')
          return
        }

        location.replace(base + '/' + location.search + location.hash)
      })()
    </script>
  </head>
  <body>
    <p><a href="/PRD/">Back to PRD directory</a> · <a href="/PRD/matching-management/">MatchingManagement</a></p>
  </body>
</html>
