<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchingManagement — V Exchange Admin</title>
    <script>
      // GitHub Pages SPA deep-link restore (paired with /PRD/404.html).
      (function () {
        try {
          var redirect = sessionStorage.getItem('prd-pages-redirect')
          if (!redirect) return
          sessionStorage.removeItem('prd-pages-redirect')
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
