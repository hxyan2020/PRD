name: Publish CRMP Plus to GitHub Pages

# Publishes upgraded CRMP Plus to /PRD/crmp-plus/ only.
# Original CRMP Admin at /PRD/crmp-admin/ is frozen (no CS/TR) and is restored
# from .github/frozen-crmp-admin.sha whenever this workflow runs so Plus never
# overwrites it again.

on:
  push:
    branches: [cursor/crmp-plus-a935, cursor/ai-use-manual-a935, cursor/vantage-orange-theme-a935, cursor/ai-db-gateway-a935, cursor/restore-crmp-admin-a935]
    paths:
      - "platform/**"
      - ".github/workflows/crmp-plus-pages.yml"
      - ".github/frozen-crmp-admin.sha"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crmp-plus-static
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Build static CRMP Plus snapshot
        working-directory: platform
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /PRD/crmp-plus
        run: |
          npm ci
          npm run build:pages
      - name: Stage nested Pages folder
        run: |
          mkdir -p publish/crmp-plus
          cp -a platform/out/. publish/crmp-plus/
          touch publish/crmp-plus/.nojekyll
      - name: Restore frozen original CRMP Admin (no CS/TR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FROZEN_SHA="$(tr -d '[:space:]' < .github/frozen-crmp-admin.sha)"
          test -n "$FROZEN_SHA"
          rm -rf .frozen-gh-pages publish/crmp-admin
          git clone --filter=blob:none --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .frozen-gh-pages
          git -C .frozen-gh-pages fetch --depth=1 origin "$FROZEN_SHA"
          git -C .frozen-gh-pages checkout "$FROZEN_SHA" -- crmp-admin
          mkdir -p publish/crmp-admin
          cp -a .frozen-gh-pages/crmp-admin/. publish/crmp-admin/
          touch publish/crmp-admin/.nojekyll
          if [ -e publish/crmp-admin/admin/cs-desk ] || [ -e publish/crmp-admin/admin/cs-dashboard ] || [ -e publish/crmp-admin/admin/cs-log ] || [ -e publish/crmp-admin/cs ]; then
            echo "Refusing to publish CS/TR onto original CRMP Admin" >&2
            exit 1
          fi
          test -f publish/crmp-admin/admin/index.html
          test -f publish/crmp-admin/admin/messenger/index.html
          rm -rf .frozen-gh-pages
      - name: Publish gh-pages (keep sibling sites)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          publish_branch: gh-pages
          keep_files: true
      - name: Public URL
        run: |
          {
            echo "CRMP Plus (upgraded admin — includes CS/TR)"
            echo "- https://hxyan2020.github.io/PRD/crmp-plus/admin/"
            echo "- Docs → AI Use Manual: https://hxyan2020.github.io/PRD/crmp-plus/admin/docs/ai-use/"
            echo "Original CRMP Admin (frozen — no CS/TR)"
            echo "- https://hxyan2020.github.io/PRD/crmp-admin/admin/"
          } >> "$GITHUB_STEP_SUMMARY"
