name: Deploy Trading Risk Ninja

on:
  push:
    branches:
      - main
      - cursor/trading-risk-ninja-75a7
    paths:
      - "docs/**"
      - ".github/workflows/pages-trading-risk-ninja.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/ to gh-pages/trading-risk-ninja
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: trading-risk-ninja
          keep_files: true
