# Backup cron: hit the public production alias so Lark pushes still fire
# if Vercel Authentication SSO is re-enabled on deployment hostnames.
# Vercel Cron itself targets the deployment host (see LARK.md).
name: Lark cron backup

on:
  schedule:
    # Every 15 minutes + :01/:31 (UTC). cron-tick alone fans out all jobs
    # (idempotent: daily ≥09:00 CST, weekly Friday, demos/slots self-gated).
    - cron: '*/15 * * * *'
    - cron: '1,31 * * * *'
  workflow_dispatch:

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke Lark cron-tick on public alias
        env:
          BASE: https://vex-llm-proxy.vercel.app
        run: |
          set -euo pipefail
          # cron-tick fans out: nudge, oscillation, market, weekly-demo,
          # daily-market-report, weekly-report (each handler self-gated).
          paths=(
            /api/lark/cron-tick
          )
          for path in "${paths[@]}"; do
            echo "=== GET ${path} ==="
            code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" \
              -H "x-vercel-cron: 1" \
              -H "user-agent: github-actions-lark-cron-backup" \
              "${BASE}${path}" || echo "000")
            echo "HTTP ${code}"
            head -c 800 /tmp/cron-body.json || true
            echo
            if [ "$code" != "200" ] && [ "$code" != "502" ]; then
              echo "::warning::${path} returned ${code}"
            fi
          done
