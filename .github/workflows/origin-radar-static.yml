name: OriginRadar static

on:
  push:
    paths:
      - "origin-radar/**"
      - ".github/workflows/origin-radar-static.yml"

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: origin-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build:static
