name: Publish Vantage static site

on:
  push:
    branches: [cursor/vantage-market-intelligence-1a73, cursor/fix-mi-desk-a935, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vantage-static
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vantage/package-lock.json
      - name: Build portable static site
        working-directory: vantage
        env:
          NEXT_PUBLIC_BASE_PATH: /PRD
        run: |
          npm ci
          npm test
          npm run build
          python3 scripts/rewrite-nested-pages-prefix.py --self-test
      - name: Keep sibling GitHub Pages sites
        run: |
          git fetch origin gh-pages --depth=1
          git archive origin/gh-pages gap-plan trading-risk-ninja risk-handbook risk-champion-site | tar -x -C vantage/out
          python3 vantage/scripts/rewrite-nested-pages-prefix.py vantage/out/risk-champion-site --prefix /PRD/risk-champion-site
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vantage/out
          publish_branch: gh-pages
          keep_files: true
      - name: Public URL
        run: |
          {
            echo "Public URLs"
            echo "- Home: https://hxyan2020.github.io/PRD/"
            echo "- Desk: https://hxyan2020.github.io/PRD/desk/"
            echo "- Entities: https://hxyan2020.github.io/PRD/entities/"
            echo "- Regulation: https://hxyan2020.github.io/PRD/regulation/"
            echo "- Risk tools: https://hxyan2020.github.io/PRD/risk-tools/"
            echo "- Sources: https://hxyan2020.github.io/PRD/sources/"
            echo "- Gap plan: https://hxyan2020.github.io/PRD/gap-plan/"
            echo "- Trading Risk Ninja: https://hxyan2020.github.io/PRD/trading-risk-ninja/"
            echo "- Risk handbook: https://hxyan2020.github.io/PRD/risk-handbook/"
            echo "- Risk Champion: https://hxyan2020.github.io/PRD/risk-champion-site/"
            echo "- Champion demos: https://hxyan2020.github.io/PRD/risk-champion-site/demos/"
            echo "- Champion study: https://hxyan2020.github.io/PRD/risk-champion-site/study/"
          } >> "$GITHUB_STEP_SUMMARY"
