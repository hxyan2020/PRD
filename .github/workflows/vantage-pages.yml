name: Publish Vantage static site

on:
  push:
    branches: [cursor/vantage-market-intelligence-1a73, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vantage-static
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vantage/package-lock.json
      - name: Build portable static site
        working-directory: vantage
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vantage/out
          publish_branch: gh-pages
          keep_files: true
