name: Deploy Vantage to GitHub Pages

on:
  push:
    branches: [cursor/vantage-market-intelligence-1a73, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already enabled"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow
          fi
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vantage/package-lock.json
      - name: Build static site
        working-directory: vantage
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vantage/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
