name: Deploy V Exchange Admin

on:
  push:
    branches: [main]
    paths:
      - 'v-exchange-admin/**'
      - '.github/workflows/deploy-v-exchange-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v-exchange-admin
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v-exchange-admin/package-lock.json

      - name: Install and build
        working-directory: v-exchange-admin
        run: |
          npm ci
          npm run build:pages
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v-exchange-admin/dist

      - id: deployment
        uses: actions/deploy-pages@v4
