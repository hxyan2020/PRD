name: Deploy V Exchange Admin

on:
  push:
    branches: [main]
    paths:
      - 'v-exchange-admin/**'
      - 'pages-root/**'
      - '.github/workflows/deploy-v-exchange-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-v-exchange-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v-exchange-admin/package-lock.json

      - name: Install and build MatchingManagement
        working-directory: v-exchange-admin
        run: |
          npm ci
          npm run build:pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Keep sibling sites (fate-atlas, crmp-admin, venture-scan, …).
      # Never use force_orphan — that wipes the whole gh-pages branch.
      - name: Publish MatchingManagement under /matching-management
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: v-exchange-admin/dist
          destination_dir: matching-management
          publish_branch: gh-pages
          keep_files: true

      # Root directory page (no auto-redirect to Fatum Atlas).
      - name: Publish PRD directory entry (replace fate root hijack)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-root
          publish_branch: gh-pages
          keep_files: true
