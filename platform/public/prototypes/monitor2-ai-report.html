.sev-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:7px;font-weight:800;padding:5px 8px}
.sev-chip.is-current{outline:2px solid var(--brand);outline-offset:1px}
.owner-assign{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px;color:#4d617d;font-size:10px}
.owner-assign b{color:#1d5c99}
.audit-indicator{display:inline-flex;padding:5px 8px;border-radius:5px;color:#557191;background:#eff5fc;font-size:10px;font-weight:770}
.source-link{color:var(--brand);font-size:10px;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.source-link:hover{color:var(--brand-ink)}
.source-ref{font-size:9px;color:#73869d;display:block;margin:5px 0 0}
.rca-row{border:1px solid #e7edf5;border-radius:9px;padding:12px 13px;margin:9px 0;background:#fdfefe}
.rca-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:6px}
.rca-name{font-weight:850;font-size:11px;color:#1e3656}
.rca-desc{font-size:10.5px;color:#50637b;line-height:1.8;margin-top:4px}
.rca-evidence{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #eef2f7}
.readonly-notice{background:#f2f6fb;border:1px solid #dde7f3;color:#4b6584;border-radius:7px;padding:12px;font-size:10.5px;line-height:1.7}
.source-panel{line-height:1.7;font-size:11px;color:#485d79}
.source-panel pre{background:#102137;color:#e1ebf9;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;font-size:10px}
.source-meta{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:8px 0}
.source-meta b{color:#304864}
.source-meta span{color:#7a8a9e}
.lark-card .sev-chip{font-size:10px}
.lark-card .lark-rca{border-top:1px solid #e8edf5;margin-top:10px;padding-top:9px;color:#4b607b;font-size:10px;line-height:1.65}
.lark-card .lark-rca-item{margin:6px 0}
.lark-card .lark-rca-item strong{font-weight:850;color:#324c70}
.lark-card .lark-evidence-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.lark-static-explainer{background:var(--blueLight);border:1px solid #c5e3e0;border-radius:7px;padding:11px;font-size:10px;color:var(--brand-ink);line-height:1.7}
.lark-card-banner{background:linear-gradient(105deg,#044855,#0b6e6a)}
.lark-card.readonly .lark-card-banner{background:linear-gradient(105deg,#163049,#3d6a68)}
@media(max-width:660px){.source-meta{grid-template-columns:1fr}.sev-strip{gap:5px}.rca-row{padding:10px}.lark-card .lark-evidence-links{gap:4px}}

</style>

function toast(s){const n=document.getElementById('toast');n.textContent=s;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),4200)}
let modalType=null;
function openModal(type){if(type==='escalate'&&!canEscalate()){toast(t('terminalHint'));return}modalType=type;const title=document.getElementById('dialog-title'),desc=document.getElementById('dialog-desc'),fields=document.getElementById('dialog-fields');const config={assign:['modalAssignTitle','modalAssignDesc'],escalate:['modalEscTitle','modalEscDesc'],close:['modalCloseTitle','modalCloseDesc'],feedback:['modalFeedTitle','modalFeedDesc'],report:['reportDetailsTitle','reportDetailsDesc']};const [a,b]=config[type];title.textContent=t(a);desc.textContent=t(b);if(type==='assign')fields.innerHTML=`<label for="modal-team">${t('assignTeam')}</label><select id="modal-team">${Object.keys(memberDirectory).map(k=>option(k,memberTeams[state.lang][k])).join('')}</select><label for="modal-person">${t('assignPerson')}</label><select id="modal-person"></select><div class="footnote">${t('assignNotice')}</div>`;else if(type==='escalate')fields.innerHTML=`<div class="inline-note">${esc(roleLabels[state.lang][state.actingRole])} → <strong>${esc(roleLabels[state.lang][escalationTarget()])}</strong></div><div class="footnote">${t('modalEscDesc')}</div>`;else if(type==='close')fields.innerHTML=`<label for="modal-note">${t('resolution')}</label><textarea id="modal-note" placeholder="${esc(t('resolutionHint'))}"></textarea><p>${t('larkSafety')}</p>`;else if(type==='feedback')fields.innerHTML=feedbackFields();else fields.innerHTML=`<div class="footnote">${t('summaryText')}<br><br>${t('staticDisclaimer')}<br>${sourceLink('lp')}<br>${sourceLink('broker')}<br>${sourceLink('fallback')}</div>`;if(type==='assign')updateAssignmentFields();if(type==='feedback')updateFeedbackFields();document.getElementById('confirm-btn').style.display=type==='report'?'none':'';document.getElementById('modal-backdrop').classList.add('show')}
function closeModal(){document.getElementById('modal-backdrop').classList.remove('show');modalType=null}
function submitModal(){const selection=document.getElementById('modal-choice')?.value;const note=document.getElementById('modal-note')?.value.trim()||'';if(modalType==='assign'){const team=document.getElementById('modal-team').value;const memberId=document.getElementById('modal-person').value;const member=memberDirectory[team].find(x=>x[0]===memberId);if(!member){toast(t('choose'));return}state.owner=member[1];state.notes.push({time:timeNow(),text:t('assign')+' → '+state.owner});larkNotice(state.owner,'assignment');toast(t('notificationRecorded')+state.owner)}else if(modalType==='escalate'){if(!canEscalate()){toast(t('terminalHint'));return}const who=roleLabels[state.lang][escalationTarget()];state.escalations.push({target:who,time:timeNow()});state.notes.push({time:timeNow(),text:t('escalate')+' → '+who});larkNotice(who,'escalation');toast(t('escalateDone')+who)}else if(modalType==='close'){state.closeRequests.push({note,time:timeNow()});toast(t('closeDone'))}else if(modalType==='feedback'){const index=Number(selection.split('_')[1]);const sub=document.getElementById('modal-subreason');const severity=document.getElementById('modal-severity');if(!sub||sub.value===''){toast(t('feedbackSpecific'));return}if(severity&&!severity.value){toast(t('correctSeverity'));return}const kind=['high','low','root','impact','evidence','noise','missing','workflow','accurate'][index];const why=t('feedbackReasons')[kind][Number(sub.value)];state.feedback.push({reason:t('reasons')[index],specific_reason:why,severity:severity?.value||null,note,time:timeNow()});state.notes.push({time:timeNow(),text:t('feedbackAt')+' · '+why});toast(t('feedbackDone'))}closeModal();render()}
function action(type){if(state.mode==='static'&&['ack','assign','escalate','close','feedback'].includes(type)){toast(t('readonlyNotice'));return}switch(type){case 'ack':state.acked=true;state.notes.push({time:timeNow(),text:t('ack')});render();toast(t('ackDone'));break;case 'assign':case 'escalate':case 'close':case 'feedback':case 'report':openModal(type);break;case 'nav':toast(t('investigationOnly'));break;case 'export':exportJSON();break}}
function exportJSON(){const data={prototype:true,incident_id:'INC-1028',severity:'P2',status:state.acked?'ACKNOWLEDGED':'OPEN',owner:ownerLabel(),report_version:`v1.${state.version-1}`,sample_kpis:{lp_quote_age:'4.8s',final_quote_freeze:'7.2s',correlated_l1:3},investigations:Object.keys(state.investigated),notes:state.notes,feedback:state.feedback,notifications:state.notifications,acting_role:state.actingRole,escalations:state.escalations,close_requests:state.closeRequests};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='INC-1028-demo-report.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast(t('exported'))}
function sendChat(text){if(!text.trim())return;const v=text.trim();const lc=v.toLowerCase();let kind;if(/fallback|backup|备用|切换|接管|回退/.test(lc))kind='fallback';else if(/客户|订单|影响|client|customer|order|impact/.test(lc))kind='impact';else if(/历史|类似|过往|history|similar|past/.test(lc))kind='history';else if(/新闻|市场|波动|news|market|calendar|fomc/.test(lc))kind='market';else if(/日志|服务器|队列|admin|logs|server|queue|pricing engine/.test(lc))kind='logs';if(kind)investigate(kind,v);else{state.messages.push({role:'user',value:v},{role:'bot',value:t('investigationOnly')});render({scrollChat:true})}}
document.addEventListener('click',e=>{const ev=e.target.closest('[data-evidence]');if(ev){e.preventDefault();showEvidence(ev.dataset.evidence);return}const surface=e.target.closest('[data-surface]');if(surface){state.surface=surface.dataset.surface;render();return}const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;render();return}const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;render();return}const query=e.target.closest('[data-query]');if(query){investigate(query.dataset.query);return}const ac=e.target.closest('[data-action]');if(ac){action(ac.dataset.action);return}const op=e.target.closest('[data-click]');if(op){if(op.dataset.click==='dismiss-modal')closeModal();else if(op.dataset.click==='submit-modal')submitModal();return}if(e.target.id==='modal-backdrop')closeModal()});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form="chat"]');if(!form)return;e.preventDefault();const input=form.querySelector('[name="message"]');const value=input.value;input.value='';sendChat(value)});
document.addEventListener('change',e=>{if(e.target.classList.contains('active-role')){state.actingRole=e.target.value;render()}else if(e.target.id==='modal-team')updateAssignmentFields();else if(e.target.id==='modal-choice'&&modalType==='feedback')updateFeedbackFields()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
