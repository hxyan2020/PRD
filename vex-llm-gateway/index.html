<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V Exchange LLM Gateway</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      display: grid;
      place-items: center;
      background: #0f1419;
      color: #e8eef6;
    }
    main { max-width: 420px; padding: 24px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    h1 span { color: #e8792f; }
    p { color: #8b9bb0; font-size: .9rem; line-height: 1.45; }
    code { color: #e8792f; }
  </style>
</head>
<body>
  <main>
    <h1>V Exchange <span>LLM Gateway</span></h1>
    <p>
      Desk-token authenticated <code>/api/chat</code> for the Risk Tool.
      Daily spend is capped per caller (default USD 10).
    </p>
    <p id="status">Gateway online</p>
  </main>
  <script>
    fetch('/api/chat').then(r => r.json()).then(d => {
      document.getElementById('status').textContent = d.ok
        ? 'Gateway online'
        : 'Gateway unreachable'
    }).catch(() => {
      document.getElementById('status').textContent = 'Gateway unreachable'
    })
  </script>
</body>
</html>
