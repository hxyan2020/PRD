name: canon
region: sgp
services:
  - name: web
    github:
      repo: hxyan2020/PRD
      branch: cursor/canon-music-streaming-c956
      deploy_on_push: true
    source_dir: canon
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /hx/health.json
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
