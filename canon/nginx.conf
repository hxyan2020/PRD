server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /hx/ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /api/hx-viewership {
    proxy_pass http://188.166.214.47:3520/collect;
    proxy_http_version 1.1;
    proxy_set_header Host 188.166.214.47;
    proxy_set_header Content-Type application/json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
