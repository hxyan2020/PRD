<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0c5f4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Six hours">
  <meta name="description" content="Risk Champion study plan: 26 weeks, 6 hours each, to close trading-risk, product, platform, quant, and AI gaps.">
  <title>Six hours — Risk Champion study plan</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <header class="top">
    <p class="parent-brand"><a href="../">Risk Champion</a> · Finance Risk Playbook</p>
    <p class="kicker" id="date-range">28 Sep 2026 – 28 Mar 2027</p>
    <h1>Six hours</h1>
    <p class="lede">Twenty-six weeks. Six hours each. One portfolio across trading risk, risk product, the platform, and AI.</p>
  </header>

  <section class="dock" aria-label="Overall progress">
    <div class="dock-row">
      <p class="dock-label" id="overall-label">0 of 26 weeks</p>
      <p class="dock-pct" id="overall-pct">0%</p>
    </div>
    <div class="bar" id="overall-bar" role="progressbar" aria-valuemin="0" aria-valuemax="26" aria-valuenow="0" aria-label="Weeks finished">
      <span id="overall-fill"></span>
    </div>
    <p class="dock-sub" id="overall-sub">0 of 156 hours logged. Finish a week and this bar moves.</p>
  </section>

  <div class="chips" id="chips" role="tablist" aria-label="Filter the plan"></div>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-view="plan" class="is-on">Plan</button>
    <button type="button" data-view="paths">Paths</button>
    <button type="button" data-view="notebook">Notes</button>
    <button type="button" data-view="progress">Progress</button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="notebook.js"></script>
  <script src="labs-starters.js"></script>
  <script src="lab-ide.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="viz.js?v=extensive"></script>
  <script src="formulas.js?v=katex1"></script>
  <script src="app.js"></script>
  <script src="tutor.js"></script>
  <script src="selection.js"></script>
</body>
</html>
